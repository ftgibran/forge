services:
  postgres:
    image: postgres:16-alpine
    container_name: forge-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nestjs_app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: forge-api
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file:
      - ./apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:8080/api\").then(() => process.exit(0)).catch(() => process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: forge-admin
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - ./apps/admin/.env
    depends_on:
      api:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: forge-client
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file:
      - ./apps/client/.env
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
